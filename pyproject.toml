[project]
name = "amendaq"
version = "0.1.0"
description = "Knowledge Agent customer service (reference implementation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
ui = ["gradio>=5.0"]
web = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0", "python-multipart>=0.0.9"]
compare = [
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",
    "sentence-transformers>=3.3.0",
    "python-dotenv>=1.0",
    "json-repair>=0.30",
    "pydantic>=2.0",
    "networkx>=3.0",
    "nano-vectordb>=0.0.4",
    "aiohttp>=3.9",
    "tiktoken>=0.7",
]
lightrag = ["lightrag-hku>=1.4"]

[project.scripts]
amendaq = "amendaq.cli:main"
amendaq-ui = "amendaq.ui.gradio_app:main"
amendaq-api = "amendaq.api.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
